<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Generador de Contraseñas — Cooperativa OPE</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{/*bg:#f3f6f9;--card:#ffffff;--accent:#205978;--accent-2:#f2c12e;--muted:#6b7280;--radius:14px*/}
  *{box-sizing:border-box}
  body{margin:0;font-family:Inter, system-ui, -apple-system, 'Segoe UI', Roboto, Arial;background:var(--bg);color:#0f172a;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px}
  .container{width:100%;max-width:720px}
  header{text-align:center;margin-bottom:18px}
  .logo-small{width:200px;height:200px;object-fit:contain;border-radius:10px;background:#fff;padding:8px;display:inline-block;box-shadow:0 6px 18px rgba(12,47,88,0.06)}
  .card{background:var(--card);border-radius:16px;padding:22px;box-shadow:0 12px 40px rgba(12,47,88,0.08);display:grid;grid-template-columns:1fr;gap:14px}
  h1{margin:0;font-size:20px;color:var(--accent);text-align:center}
  .subtitle{text-align:center;color:var(--muted);font-size:14px}
  .form-row{display:flex;gap:10px;align-items:center;margin-top:6px}
  input[type="text"]{flex:1;padding:12px 14px;border-radius:10px;border:1px solid #e6eefb;font-size:16px}
  button.primary{background:#205978;color:#ffffff;border:0;padding:12px 16px;border-radius:10px;font-weight:600;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,0.12)}
  button.primary:hover{background:#163f55}
  .result-box{margin-top:12px;padding:16px;border-radius:12px;background:linear-gradient(180deg,#f8fafc,#ffffff);border:1px solid #eef2f7;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .pw{font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, 'Roboto Mono', monospace;font-size:18px;letter-spacing:1px;color:#0f172a}
  .pw-label{font-size:12px;color:var(--muted);margin-bottom:6px}
  .copy-btn{background:#f2c12e;color:#10313c;border:none;padding:8px 12px;border-radius:10px;cursor:pointer;font-weight:600}
  .note{font-size:13px;color:var(--muted);text-align:center;margin-top:8px}
  footer{text-align:center;margin-top:12px;color:var(--muted);font-size:13px}
  @media (max-width:520px){ .form-row{flex-direction:column} .copy-btn{width:100%} .result-box{flex-direction:column;align-items:flex-start} }
</style>
</head>

    const padded = nreDigits.padStart(3,'0');
    const last3 = padded.slice(-3);
    let prod = 1;
    for(const ch of last3){
      let v = Number(ch);
      if(v === 0) v = 1;
      prod *= v;
    }
    const mod100 = prod % 100;
    return String(mod100).padStart(2,'0');
  }

  function lettersFromLast4(nreDigits){
    const z = nreDigits.padStart(4,'0');
    const last4 = z.slice(-4);
    let letters = '';
    for(const ch of last4){
      let pos = Number(ch);
      if(pos === 0) pos = 10;
      letters += (pos>=1 && pos<=WORD.length) ? WORD.charAt(pos-1) : '?';
    }
    return letters;
  }

  function generate(nreRaw){
    const digits = (nreRaw||'').replace(/\D/g,'');
    if(!digits) return {ok:false, msg:'Introduce al menos 1 dígito del NRE.'};
    const last = digits[digits.length-1];
    const prefix = prefixFromSum(digits);
    const num = productLast3To2Digits(digits);
    const letters = lettersFromLast4(digits);
    const suffix = letterFromDigit(last, false);
    return {ok:true, value: prefix + num + letters + suffix};
  }

  const btn = document.getElementById('btn');
  const copyBtn = document.getElementById('copyBtn');
  const inp = document.getElementById('nre');
  const resText = document.getElementById('resText');
  const resultBox = document.getElementById('result');

  function showResult(obj){
    if(!obj.ok){
      resText.textContent = obj.msg;
      resText.style.color = '#b91c1c';
      resultBox.style.display = 'flex';
      return;
    }
    resText.textContent = obj.value;
    resText.style.color = '#0f172a';
    resultBox.style.display = 'flex';
  }

  btn.addEventListener('click', ()=>{
    const out = generate(inp.value.trim());
    showResult(out);
  });

  copyBtn.addEventListener('click', async ()=>{
    try{
      await navigator.clipboard.writeText(resText.textContent);
      copyBtn.textContent = 'Copiado ✓';
      setTimeout(()=> copyBtn.textContent = 'Copiar', 1200);
    }catch(e){
      alert('No se pudo copiar. Selecciona y copia manualmente.');
    }
  });

  inp.addEventListener('keydown', (e)=>{ if(e.key==='Enter') btn.click(); });
  window.addEventListener('load', ()=> inp.focus());
})();
</script>
